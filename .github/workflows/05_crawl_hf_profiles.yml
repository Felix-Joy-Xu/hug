name: 05 - HF 组织/用户画像

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: '本轮运行分钟数（测试用短值，默认 290）'
        required: false
        default: '290'
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时自动触发一轮（MAX_MINUTES=290 跑满约 5 小时，断点续爬）

permissions:
  actions: read
  contents: write

concurrency:
  group: hf-profiles
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        include:
          - shard: 0
            account: felixcu
            rps: 2.5
          - shard: 1
            account: citlalicutie
            rps: 2.5
          - shard: 2
            account: felix114
            rps: 2.5
          - shard: 3
            account: hateypu
            rps: 2.5
          - shard: 4
            account: floiraaaaa
            rps: 2.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 恢复上次断点（仓库里）
        run: |
          mkdir -p modelscope_output
          if [ -f modelscope_output/state_hf_profiles_${{ matrix.shard }}.json ]; then
            echo "恢复断点，继续上次采集"
          else
            echo "首次运行（或断点缺失），全新采集"
          fi

      - name: 下载 HF 全量清单（models 的 owner 列表来源）
        run: |
          set -e
          RUN_ID=$(gh run list --repo ${{ github.repository }} \
            --workflow 01_crawl_hf_full.yml \
            --branch main \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          echo "01 run id: $RUN_ID"
          gh run download "$RUN_ID" --repo ${{ github.repository }} \
            --name hf-models-full \
            --dir modelscope_output
          if [ -d modelscope_output/hf-models-full ]; then
            mv modelscope_output/hf-models-full/* modelscope_output/
            rm -rf modelscope_output/hf-models-full
          fi
          ls -lh modelscope_output/hf_models_all.jsonl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 采集组织/用户画像（片 ${{ matrix.shard }}/5）+ 后台 30 分钟自动提交
        run: |
          # 带重试的提交函数：先暂存本 shard 数据（避免 pull 因 unstaged changes 拒绝），pull 成功才 push
          commit_and_push() {
            for i in 1 2 3 4 5 6 7 8; do
              git add -f modelscope_output/state_hf_profiles_${{ matrix.shard }}.json \
                         modelscope_output/hf_org_profiles_${{ matrix.shard }}.jsonl \
                         modelscope_output/hf_user_profiles_${{ matrix.shard }}.jsonl \
                         modelscope_output/hf_owner_index_${{ matrix.shard }}.csv
              if [ "${{ matrix.shard }}" = "0" ]; then
                git add -f modelscope_output/PROGRESS.md
              fi
              git diff --cached --quiet || git commit -m "data: HF 画像进度合并 [skip ci]" 2>/dev/null || true
              if timeout 120 git pull --rebase origin main 2>/dev/null; then
                if timeout 120 git push origin main; then
                  echo "提交推送成功"
                  return 0
                fi
                echo "push 失败，重试 $i/8..."
              else
                # 冲突/超时：abort 回 main（避免 detached HEAD），数据文件保留本地
                git rebase --abort 2>/dev/null || true
                git checkout main 2>/dev/null || true
                echo "pull 冲突/超时已处理（abort 回 main），重试 $i/8..."
              fi
              sleep 10
            done
            echo "推送多次失败（数据已在 artifact 兜底），不报错避免 run failure"
            return 0
          }

          # 后台守护进程：每 30 分钟只记录状态（不生成 PROGRESS.md，避免 unstaged changes 干扰最终提交）
          (
            while true; do
              sleep $((1800 + RANDOM % 300))
              echo "=== 每 30 分钟守护进程心跳 ==="
            done
          ) &
          AUTO_COMMIT_PID=$!

          # 主采集（MAX_MINUTES=290 主动收尾，留时间给最终 push）
          python crawl_hf_profiles.py \
            --list-file modelscope_output/hf_models_all.jsonl \
            --workers 8 \
            --shards 5 \
            --shard ${{ matrix.shard }}

          # 采集结束，停止后台守护并做本地提交（不 push——由独立 commit job 统一推送，避免 5 job 并发 git 冲突）
          kill $AUTO_COMMIT_PID 2>/dev/null || true
          sleep $(( ${{ matrix.shard }} * 5 ))
          git add -f modelscope_output/state_hf_profiles_${{ matrix.shard }}.json \
                     modelscope_output/hf_org_profiles_${{ matrix.shard }}.jsonl \
                     modelscope_output/hf_user_profiles_${{ matrix.shard }}.jsonl \
                     modelscope_output/hf_owner_index_${{ matrix.shard }}.csv
          git commit -m "data: HF 画像 shard${{ matrix.shard }} 最终进度 [skip ci]" 2>/dev/null || echo "无新数据"
        env:
          HF_BASE: https://huggingface.co
          HF_ACCOUNT_TOKENS: ${{ secrets.HF_ACCOUNT_TOKENS }}
          HF_ACCOUNT: ${{ matrix.account }}
          HF_TOKEN_INDEX: 0
          HF_RPS: ${{ matrix.rps }}
          MAX_MINUTES: ${{ inputs.max_minutes || '290' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-profiles-shard${{ matrix.shard }}
          path: |
            modelscope_output/hf_org_profiles_${{ matrix.shard }}.jsonl
            modelscope_output/hf_user_profiles_${{ matrix.shard }}.jsonl
            modelscope_output/hf_owner_index_${{ matrix.shard }}.csv
            modelscope_output/state_hf_profiles_${{ matrix.shard }}.json
          retention-days: 30

  commit-data:
    runs-on: ubuntu-latest
    needs: profiles
    timeout-minutes: 60
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 下载所有 shard artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/shard
          pattern: hf-profiles-shard*

      - name: 合并数据并统一提交
        run: |
          mkdir -p modelscope_output
          for d in /tmp/shard/hf-profiles-shard*; do
            echo "=== $d ==="
            ls -la "$d"/
            cp -r "$d"/* modelscope_output/ || echo "cp $d 失败"
          done
          echo "=== modelscope_output/ ==="
          ls -la modelscope_output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 生成汇总报告（读全部 state）
          python update_progress.py
          git add -f modelscope_output/
          git diff --cached --quiet || git commit -m "data: HF 画像全 shard 汇总 $(date -u +%F-%H:%M) [skip ci]"
          # 统一 push（单 job 无并发冲突）
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase origin main 2>&1; then
              if timeout 120 git push origin main 2>&1; then
                echo "全部数据推送成功"
                exit 0
              fi
            else
              echo "pull 失败: $?"
            fi
            git rebase --abort 2>/dev/null || true
            git checkout main 2>/dev/null || true
            sleep 10
          done
          echo "推送失败（数据在 artifact）"
        env:
          SHARDS: 5
