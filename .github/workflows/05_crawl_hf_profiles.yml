name: 05 - HF 组织/用户画像

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小时自动触发一轮（断点续爬，多轮累计）

permissions:
  actions: read
  contents: write

concurrency:
  group: hf-profiles
  cancel-in-progress: true

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        include:
          - shard: 0
            account: felixcu
            rps: 1.0
          - shard: 1
            account: felixcu
            rps: 1.0
          - shard: 2
            account: felixcu
            rps: 1.0
          - shard: 3
            account: citlalicutie
            rps: 1.5
          - shard: 4
            account: citlalicutie
            rps: 1.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 恢复上次断点（仓库里）
        run: |
          mkdir -p modelscope_output
          if [ -f modelscope_output/state_hf_profiles_${{ matrix.shard }}.json ]; then
            echo "恢复断点，继续上次采集"
          else
            echo "首次运行（或断点缺失），全新采集"
          fi

      - name: 下载 HF 全量清单（models 的 owner 列表来源）
        run: |
          set -e
          RUN_ID=$(gh run list --repo ${{ github.repository }} \
            --workflow 01_crawl_hf_full.yml \
            --branch main \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          echo "01 run id: $RUN_ID"
          gh run download "$RUN_ID" --repo ${{ github.repository }} \
            --name hf-models-full \
            --dir modelscope_output
          if [ -d modelscope_output/hf-models-full ]; then
            mv modelscope_output/hf-models-full/* modelscope_output/
            rm -rf modelscope_output/hf-models-full
          fi
          ls -lh modelscope_output/hf_models_all.jsonl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 采集组织/用户画像（片 ${{ matrix.shard }}/5）+ 后台 30 分钟自动提交
        run: |
          # 带重试的提交函数：pull（成功才 push），最多 8 次，超时更长防并发排队
          commit_and_push() {
            for i in 1 2 3 4 5 6 7 8; do
              if timeout 180 git pull --rebase origin main 2>/dev/null; then
                if timeout 180 git push origin main 2>/dev/null; then
                  echo "提交推送成功"
                  return 0
                fi
                echo "push 失败，重试 $i/8..."
              else
                git rebase --abort 2>/dev/null || true
                echo "pull 冲突/超时，abort 重试 $i/8..."
              fi
              sleep 15
            done
            echo "推送多次失败，下轮重试"
            return 1
          }

          # 后台守护进程：每 30 分钟自动 commit + push 已爬数据（借鉴 crawler 仓库模式）
          (
            while true; do
              sleep 1800
              echo "=== 每 30 分钟自动提交进度 ==="
              python update_progress.py
              git add -f modelscope_output/state_hf_profiles_${{ matrix.shard }}.json \
                         modelscope_output/hf_org_profiles_${{ matrix.shard }}.jsonl \
                         modelscope_output/hf_user_profiles_${{ matrix.shard }}.jsonl \
                         modelscope_output/hf_owner_index_${{ matrix.shard }}.csv \
                         modelscope_output/PROGRESS.md
              git commit -m "data: HF 画像 shard${{ matrix.shard }} 进度 [skip ci]" 2>/dev/null || echo "无新数据可提交"
              commit_and_push
            done
          ) &
          AUTO_COMMIT_PID=$!

          # 主采集（每轮 2 小时主动收尾保存断点）
          python crawl_hf_profiles.py \
            --list-file modelscope_output/hf_models_all.jsonl \
            --workers 8 \
            --shards 5 \
            --shard ${{ matrix.shard }}

          # 采集结束，停止后台守护并做最终提交
          kill $AUTO_COMMIT_PID 2>/dev/null || true
          git add -f modelscope_output/state_hf_profiles_${{ matrix.shard }}.json \
                     modelscope_output/hf_org_profiles_${{ matrix.shard }}.jsonl \
                     modelscope_output/hf_user_profiles_${{ matrix.shard }}.jsonl \
                     modelscope_output/hf_owner_index_${{ matrix.shard }}.csv \
                     modelscope_output/PROGRESS.md
          git commit -m "data: HF 画像 shard${{ matrix.shard }} 最终进度 [skip ci]" 2>/dev/null || echo "无新数据"
          commit_and_push
        env:
          HF_BASE: https://huggingface.co
          HF_ACCOUNT: ${{ matrix.account }}
          HF_TOKEN_INDEX: 0
          HF_RPS: ${{ matrix.rps }}
          MAX_MINUTES: 300

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-profiles-shard${{ matrix.shard }}
          path: |
            modelscope_output/hf_org_profiles_${{ matrix.shard }}.jsonl
            modelscope_output/hf_user_profiles_${{ matrix.shard }}.jsonl
            modelscope_output/hf_owner_index_${{ matrix.shard }}.csv
            modelscope_output/state_hf_profiles_${{ matrix.shard }}.json
          retention-days: 30
